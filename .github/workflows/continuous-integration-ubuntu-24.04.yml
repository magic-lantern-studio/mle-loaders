name: Continuous Integration Build (Ubuntu 24.04)

on:
  workflow_dispatch:  # Allow manual triggers
  push:
    branches: [ "main" ]

env:
  MLE_ROOT: ${{ github.workspace }}/MagicLantern

jobs:
  ubuntu-build:
    name: Ubuntu 24.04 Build (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release, Debug ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # libx11-dev and libxt-dev provide the X11 headers included by the
      # player and mlert headers.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxt-dev

      # Download the latest mle-atk artifact into $MLE_ROOT. It contains the
      # mle-atk, mle-parts, mle-core-mlert, mle-core-dpp, mle-core-dwp,
      # mle-core-math and mle-core-util libraries and headers.
      - name: Download mle-atk artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download \
            --repo magic-lantern-studio/mle-atk \
            --name mle-atk-ubuntu-24.04-${{ matrix.build_type }} \
            --dir "$MLE_ROOT"
          ls -R "$MLE_ROOT"

      - name: Build and install loaders
        run: |
          for variant in rehearsal inventor runtime; do
            build=build/libmlloaders-$variant
            cmake -S Loaders/build/$variant -B "$build" -G "Unix Makefiles" \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
              -DCMAKE_INSTALL_PREFIX="$MLE_ROOT" \
              -DCMAKE_PREFIX_PATH="$MLE_ROOT"
            cmake --build "$build" --parallel 4
            cmake --install "$build"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mle-loaders-ubuntu-24.04-${{ matrix.build_type }}
          path: ${{ env.MLE_ROOT }}
